[project]
name = "divbase-api"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.165.0",
    "uvicorn==0.54.0",
    "asyncpg==0.32.0",
    "pyjwt==2.15.1",
    "pwdlib[argon2]==0.4.2",
    "starlette-admin==1.0.4",
    "emails==1.1.3",
    "jinja2==3.1.6",
    "celery==5.7.0",
    "alembic==1.20.1",
    "psycopg2-binary==2.9.13",
    "sqlalchemy[asyncio]==2.1.9", # Note that a minor bump is considered a major change for sqlalchemy
    "prometheus-client==0.26.0",
    "psutil==7.2.2",
    "boto3==1.44.9",
    "structlog==26.1.0",
    "altcha==2.5.0",
    "divbase-lib", # always uses version in repo, handled by uv
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/divbase_api/__init__.py"

[tool.uv.sources]
divbase-lib = { workspace = true }

[project.scripts]
divbase-api = "divbase_api.divbase_api:main"

[tool.ruff]
extend = "../../ruff.toml"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"divbase_cli" = { msg = "divbase-api cannot use code from divbase-cli. Move shared code to divbase-lib." }
